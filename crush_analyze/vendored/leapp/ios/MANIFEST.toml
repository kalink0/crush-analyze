# Hash-pinned manifest for files vendored byte-identical from iLEAPP,
# tracked the same disciplined way as crush-forensics' qnxprobe/ewfprobe.
# See docs/design/analyzer-runner.md ("Vendoring policy") in crush-forensics.
#
# Never hand-edit a vendored .py file directly — re-fetch from upstream at a
# new commit and update the matching entry here instead, so `sha256` always
# proves what's actually on disk came from that exact upstream commit.

