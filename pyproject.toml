[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crush-analyze"
version = "0.1.0"
description = "Analyzer runner sibling tool for Crush — curated small artifact-parsing modules over a versioned CLI + JSON contract"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Marco Neumann (kalink0)" }]
keywords = ["forensics", "dfir", "leapp", "artifact", "analysis"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "biplist>=1.0.3",
    "nska_deserialize>=1.5.1",
    "xmltodict>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
crush-analyze = "crush_analyze.cli:main"

[project.entry-points.pyinstaller40]
# Auto-discovered by any PyInstaller build that has crush-analyze installed
# (e.g. crush-forensics' own build.yml) -- no PyInstaller-side --add-data
# entry or knowledge of crush-analyze's internal layout needed there. See
# crush_analyze/__pyinstaller/.
hook-dirs = "crush_analyze.__pyinstaller:get_hook_dirs"

[project.urls]
Homepage = "https://github.com/kalink0/crush-analyze"
Issues = "https://github.com/kalink0/crush-analyze/issues"

[tool.setuptools.packages.find]
include = ["crush_analyze*"]

[tool.setuptools.package-data]
crush_analyze = ["py.typed", "vendored/leapp/**/*.toml", "vendored/leapp/LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["crush_analyze/vendored"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = [
    "build/.*",
    "crush_analyze/vendored/.*",
    "crush_analyze/__pyinstaller/.*",
]
