[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crush-analyze"
version = "0.1.0"
description = "Analyzer runner sibling tool for Crush — curated small artifact-parsing modules over a versioned CLI + JSON contract"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Marco Neumann (kalink0)" }]
keywords = ["forensics", "dfir", "leapp", "artifact", "analysis"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
crush-analyze = "crush_analyze.cli:main"

[project.urls]
Homepage = "https://github.com/kalink0/crush-analyze"
Issues = "https://github.com/kalink0/crush-analyze/issues"

[tool.setuptools.packages.find]
include = ["crush_analyze*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
